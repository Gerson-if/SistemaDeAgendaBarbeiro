<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='/css/agendar.css') }}">
    <title>Agendar - Barbearia</title>
</head>
<body>
    <header>
        <h1>Agendar Corte</h1>
        <nav>
            <ul>
                <li><a href="/">Home</a></li>
                <li><a href="/agendar">Agendar</a></li>
                <li><a href="/cortes">Cortes</a></li>
                <li><a href="/horarios">Horários</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2>Preencha suas informações</h2>
        <form action="/confirmacao" method="POST" class="agendamento-form">
            <div class="form-group">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="telefone">Telefone:</label>
                <input type="text" id="telefone" name="telefone" required>
            </div>
            <div class="form-group">
                <label for="horario">Escolha um horário:</label>
                <select id="horario" name="horario" required>
                    <option value="">Selecione um horário</option>
                    <option value="10:00">10:00</option>
                    <option value="11:00">11:00</option>
                    <option value="14:00">14:00</option>
                    <option value="15:00">15:00</option>
                </select>
            </div>
            <div class="form-group">
                <label for="corte">Escolha o tipo de corte:</label>
                <select id="corte" name="corte" required>
                    <option value="Corte Clássico">Corte Clássico - R$ 30,00</option>
                    <option value="Corte Moderno">Corte Moderno - R$ 50,00</option>
                    <option value="Corte Infantil">Corte Infantil - R$ 20,00</option>
                </select>
            </div>
            <div class="form-group">
                <label for="valor">Valor:</label>
                <input type="text" id="valor" name="valor" readonly>
            </div>
            <button type="submit" class="button">Confirmar Agendamento</button>
        </form>
    </main>

    <footer>
        <p>© 2024 Barbearia. Todos os direitos reservados.</p>
    </footer>

    <script>
        const corteSelect = document.getElementById('corte');
        const valorInput = document.getElementById('valor');

        const atualizarValor = () => {
            const selectedOption = corteSelect.options[corteSelect.selectedIndex];
            const valor = selectedOption.text.split('- R$ ')[1];
            valorInput.value = valor;
        };

        corteSelect.addEventListener('change', atualizarValor);

        // Chama a função para definir o valor ao carregar a página
        atualizarValor();
    </script>
</body>
</html>
